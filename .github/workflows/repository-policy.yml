name: Repository Policy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  contracts:
    name: Contract mirror policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned architecture contract revision
        shell: bash
        run: |
          set -euo pipefail
          arch_repo='https://github.com/LumioGames/LumioGameEngineArchitecture.git'
          arch_sha="$(tr -d '[:space:]' < contract/ORIGIN)"
          [[ "$arch_sha" =~ ^[0-9a-fA-F]{40}$ ]]
          arch_sha="${arch_sha,,}"
          arch_dir="$RUNNER_TEMP/LumioGameEngineArchitecture"
          git init --quiet "$arch_dir"
          git -C "$arch_dir" remote add origin "$arch_repo"
          git -C "$arch_dir" fetch --no-tags --depth=1 origin "$arch_sha"
          test "$(git -C "$arch_dir" rev-parse FETCH_HEAD)" = "$arch_sha"
          git -C "$arch_dir" checkout --quiet --detach "$arch_sha"
          echo "LUMIO_ARCH_REPO=$arch_dir" >> "$GITHUB_ENV"
      - name: Verify contract mirrors
        run: bash eng/verify-contract-mirror.sh
      - name: Probe reverse contract drift
        run: bash eng/verify-contract-mirror.sh --self-test

  spec:
    name: Spec and README policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate LumioAgent specification
        run: |
          node .spec/tools/spec-lint.mjs
          node --test .spec/tools/spec-lint.test.mjs
      - name: Validate repository boundary documentation
        run: |
          test -s README.md
          test -s README.en.md
          test -s LICENSE
          test -s .gitattributes
          grep -q '^\*\.md text eol=lf$' .gitattributes
          grep -q '^## 职责$' README.md
          grep -q '^## 明确不负责什么$' README.md
          grep -q '^## 收口门槛$' README.md
          grep -q '^## Responsibilities$' README.en.md
          test "$(readlink .claude/agents)" = "../.spec/agents"
          test "$(readlink .claude/skills)" = "../.spec/skills"
          test "$(readlink .agents/skills)" = "../.spec/skills"

  dotnet:
    name: .NET build and test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: lumio
          POSTGRES_PASSWORD: lumio
          POSTGRES_DB: lumio_platform_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U lumio"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PLATFORM_TEST_DB_CONNECTION_STRING: Host=127.0.0.1;Port=5432;Database=lumio_platform_test;Username=lumio;Password=lumio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore build.proj --locked-mode
      - run: dotnet build build.proj -c Release --no-restore
      - run: dotnet test tests/Lumio.Platform.Tests -c Release --no-build

  web:
    name: Web verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm -C web install --frozen-lockfile
      - run: pnpm -C web verify
